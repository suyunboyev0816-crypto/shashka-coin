<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHASHKA COIN</title>
<style>
body {
  background:#101827;color:white;
  font-family:Arial;text-align:center;
  padding:15px;
}
h1 {color:#facc15}
#board {
  display:grid;
  grid-template-columns:repeat(8,1fr);
  width:min(94vw,440px);
  margin:20px auto;
  border:4px solid #d6a64a;
}
.cell {
  aspect-ratio:1;
  display:grid;
  place-items:center;
  font-size:clamp(22px,7vw,38px);
}
.light {background:#f0d9b5}
.dark {background:#805333}
.piece {
  width:72%;height:72%;
  border-radius:50%;
  display:grid;place-items:center;
  box-shadow:inset 0 -4px 0 #0005;
}
.white {background:#fff;color:#222}
.black {background:#222;color:white}
.selected {outline:4px solid #facc15}
button {
  padding:12px 20px;border:0;
  border-radius:10px;background:#eab308;
  font-weight:bold;
}
</style>
</head>
<body>
<h1>♟️ SHASHKA COIN</h1>
<p id="turn">Oq donalar yuradi</p>
<div id="board"></div>
<button onclick="resetGame()">Qayta boshlash</button>

<script>
let board, turn, selected;

function resetGame() {
  board = Array.from({length:8},()=>Array(8).fill(""));
  for(let r=0;r<3;r++)
    for(let c=0;c<8;c++)
      if((r+c)%2===1) board[r][c]="b";
  for(let r=5;r<8;r++)
    for(let c=0;c<8;c++)
      if((r+c)%2===1) board[r][c]="w";
  turn="w"; selected=null; draw();
}

function draw() {
  const el=document.getElementById("board");
  el.innerHTML="";
  document.getElementById("turn").textContent =
    turn==="w"?"Oq donalar yuradi":"Qora donalar yuradi";

  for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
    const cell=document.createElement("div");
    cell.className="cell "+((r+c)%2?"dark":"light");
    if(selected && selected[0]===r && selected[1]===c)
      cell.classList.add("selected");

    if(board[r][c]) {
      const p=document.createElement("div");
      p.className="piece "+(board[r][c]==="w"?"white":"black");
      p.textContent="●";
      cell.appendChild(p);
    }
    cell.onclick=()=>clickCell(r,c);
    el.appendChild(cell);
  }
}

function clickCell(r,c) {
  if(!selected) {
    if(board[r][c]===turn) selected=[r,c];
  } else {
    let [sr,sc]=selected;
    let piece=board[sr][sc];
    let direction=piece==="w"?-1:1;
    if(!board[r][c] && Math.abs(c-sc)===1 &&
       r-sr===direction) {
      board[r][c]=piece;
      board[sr][sc]="";
      turn=turn==="w"?"b":"w";
    }
    selected=null;
  }
  draw();
}

resetGame();
</script>
</body>
</html>
